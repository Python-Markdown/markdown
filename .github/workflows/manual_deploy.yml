name: manual deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The branch, tag or SHA to checkout and build.'
        type: string
        required: true
        default: master

permissions:
  contents: read

jobs:

  ghpages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          path: md
          persist-credentials: false
      - name: Checkout Target Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY  }}
          repository: Python-Markdown/Python-Markdown.github.io
          path: target
      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          cd md
          python -m pip install --upgrade pip setuptools
          python -m pip install .[docs]
      - name: Build
        run: |
          cd md
          python -m zensical build --clean
      - name: Publish
        if: success()
        run: |
          cd target
          git config user.email waylan.limberg@icloud.com
          ghp-import --push --no-jekyll --branch=master ../md/site
